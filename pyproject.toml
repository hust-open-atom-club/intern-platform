[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intern-platform"
version = "0.1.0"
description = "华科开放原子开源实习管理系统后端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "pydantic>=2.8.0,<2.14",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<4.1",
  "python-jose[cryptography]>=3.3.0",
  "jsonschema>=4.23.0",
  "psycopg[binary]>=3.2.0",
  "pymysql>=1.1.1",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intern_platform = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "security: security hardening and abuse-case checks",
]
