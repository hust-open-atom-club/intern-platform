# HTTP 默认（IP / 未匹配 Host）不跳转；仅域名跳 HTTPS
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

server {
    listen 80 default_server;
    server_name _;
    # ZIP 上限 100MB，留余量
    client_max_body_size 110m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 大文件上传不在 nginx 侧整包缓冲，降低内存与体感延迟
        proxy_request_buffering off;
        client_body_buffer_size 256k;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 缺失的静态资源必须 404，禁止回退成 index.html（否则浏览器把 HTML 当 JS 执行会白屏）
    # pdf.js worker 可能为 .mjs；嵌套 location 保证 MIME，避免被 /assets/ 以 octet-stream 提供
    location /assets/ {
        location ~* \.mjs$ {
            types { application/javascript mjs; }
            default_type application/javascript;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name intern.openatom.club;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://intern.openatom.club$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name intern.openatom.club;
    client_max_body_size 110m;

    ssl_certificate     /etc/nginx/certs/intern.openatom.club_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/intern.openatom.club.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        client_body_buffer_size 256k;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        location ~* \.mjs$ {
            types { application/javascript mjs; }
            default_type application/javascript;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
